name: Build Hypper Frida APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download v1 --repo ${{ github.repository }} --pattern "base.apk" --dir assets
          gh release download v1 --repo ${{ github.repository }} --pattern "split.apk" --dir assets
          gh release download v1 --repo ${{ github.repository }} --pattern "libfrida-gadget.so" --dir assets
          ls -la assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool zipalign
          apktool --version

      - name: Decode base.apk
        run: |
          apktool d -f -o decoded assets/base.apk

      - name: Inject libs from split
        run: |
          mkdir -p decoded/lib/arm64-v8a
          cd decoded/lib/arm64-v8a
          unzip -o -j ../../../assets/split.apk "lib/arm64-v8a/*"
          cd ../../..
          cp assets/libfrida-gadget.so decoded/lib/arm64-v8a/
          cat > decoded/lib/arm64-v8a/libfrida-gadget.config.so <<'EOF'
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 27042,
              "on_load": "resume"
            }
          }
          EOF
          ls -la decoded/lib/arm64-v8a/

      - name: Patch smali Application
        run: |
          python3 <<'PY'
          import re, os, glob
          
          manifest = open('decoded/AndroidManifest.xml').read()
          
          target = None
          for m in re.finditer(r'<activity\s+([^>]+)>', manifest):
              attrs = m.group(1)
              name_match = re.search(r'android:name="([^"]+)"', attrs)
              if not name_match:
                  continue
              name = name_match.group(1)
              snippet = manifest[m.end():m.end()+600]
              if 'android.intent.action.MAIN' in snippet:
                  target = name
                  break
              if target is None and 'UnityPlayer' in name:
                  target = name
          
          if not target:
              raise SystemExit("No launcher activity found")
          
          print("Target activity: " + target)
          smali_path = target.replace('.', '/') + '.smali'
          
          found_file = None
          for smali_dir in sorted(glob.glob('decoded/smali*')):
              candidate = os.path.join(smali_dir, smali_path)
              if os.path.exists(candidate):
                  found_file = candidate
                  break
          
          if not found_file:
              raise SystemExit("Smali not found: " + smali_path)
          
          print("Found: " + found_file)
          content = open(found_file).read()
          
          pattern = r'(\.method[^\n]*\bonCreate\b[^\n]*\n(?:[^\n]*\n)*?    \.locals\s+)(\d+)'
          match = re.search(pattern, content)
          
          if not match:
              raise SystemExit("No onCreate with .locals found")
          
          old_count = int(match.group(2))
          new_count = old_count + 1
          reg = "v" + str(old_count)
          print("locals: " + str(old_count) + " -> " + str(new_count) + ", using register " + reg)
          
          new_content = content[:match.start(2)] + str(new_count) + content[match.end(2):]
          
          m2 = re.search(r'    \.locals\s+' + str(new_count) + r'\n', new_content)
          inject = (
              '    const-string ' + reg + ', "frida-gadget"\n'
              '    invoke-static {' + reg + '}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n'
          )
          new_content = new_content[:m2.end()] + inject + new_content[m2.end():]
          
          open(found_file, 'w').write(new_content)
          print("SUCCESS: patched " + found_file)
          
          verify = open(found_file).read()
          if 'frida-gadget' in verify:
              print("VERIFIED")
          else:
              raise SystemExit("Verify failed")
          PY

      - name: Build APK
        run: |
          apktool b decoded -o unsigned.apk
          ls -la unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore ks.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key -storepass 123456 -keypass 123456 \
            -dname "CN=H, OU=H, O=H, L=H, ST=H, C=US"
          zipalign -v -p 4 unsigned.apk aligned.apk || cp unsigned.apk aligned.apk
          apksigner sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 \
            --out Hypper-Frida.apk aligned.apk
          ls -la Hypper-Frida.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypper-Frida
          path: Hypper-Frida.apk
          retention-days: 7
