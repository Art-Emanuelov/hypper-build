name: Build Hypper Frida APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download v1 --repo ${{ github.repository }} --pattern "base.apk" --dir assets
          gh release download v1 --repo ${{ github.repository }} --pattern "split.apk" --dir assets
          gh release download v1 --repo ${{ github.repository }} --pattern "libfrida-gadget.so" --dir assets
          ls -la assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip zip

          # Свежий apktool с поддержкой aapt2
          curl -L -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          cat > /usr/local/bin/apktool <<'EOF'
          #!/bin/bash
          exec java -jar /usr/local/bin/apktool.jar "$@"
          EOF
          chmod +x /usr/local/bin/apktool
          apktool --version

          # Android build-tools для zipalign и apksigner
          yes | sudo sdkmanager --install "build-tools;34.0.0" > /dev/null 2>&1 || true
          sudo ln -sf "$ANDROID_HOME/build-tools/34.0.0/zipalign" /usr/local/bin/zipalign
          sudo ln -sf "$ANDROID_HOME/build-tools/34.0.0/apksigner" /usr/local/bin/apksigner
          zipalign 2>&1 | head -1 || true
          apksigner --version || true

      - name: Decode split.apk (основа с libs)
        run: |
          apktool d -f -o decoded assets/split.apk
          ls decoded/ | head -20

      - name: Inject frida-gadget + assets from base
        run: |
          mkdir -p decoded/lib/arm64-v8a

          # Копируем frida gadget
          cp assets/libfrida-gadget.so decoded/lib/arm64-v8a/

          # Конфиг gadget (порт 27042)
          cat > decoded/lib/arm64-v8a/libfrida-gadget.config.so <<'EOF'
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 27042,
              "on_load": "resume"
            }
          }
          EOF

          # Копируем assets из base.apk (метадата Unity, ресурсы)
          unzip -o assets/base.apk "assets/*" -d decoded/

          ls -la decoded/lib/arm64-v8a/
          echo "--- metadata check ---"
          ls decoded/assets/bin/Data/Managed/Metadata/ 2>/dev/null || echo "metadata dir not found"

      - name: Patch smali launcher activity
        run: |
          python3 <<'PY'
          import re, os, glob

          manifest = open('decoded/AndroidManifest.xml').read()

          target = None
          for m in re.finditer(r'<activity\s+([^>]+)>', manifest):
              attrs = m.group(1)
              name_match = re.search(r'android:name="([^"]+)"', attrs)
              if not name_match:
                  continue
              name = name_match.group(1)
              snippet = manifest[m.end():m.end()+800]
              if 'android.intent.action.MAIN' in snippet:
                  target = name
                  break

          if not target:
              for m in re.finditer(r'<activity\s+([^>]+)>', manifest):
                  name_match = re.search(r'android:name="([^"]+)"', m.group(1))
                  if name_match and 'UnityPlayer' in name_match.group(1):
                      target = name_match.group(1)
                      break

          if not target:
              raise SystemExit("ERROR: No launcher activity found")

          print("Target activity: " + target)
          smali_path = target.replace('.', '/') + '.smali'

          found_file = None
          for smali_dir in sorted(glob.glob('decoded/smali*')):
              candidate = os.path.join(smali_dir, smali_path)
              if os.path.exists(candidate):
                  found_file = candidate
                  break

          if not found_file:
              raise SystemExit("ERROR: Smali not found for: " + smali_path)

          print("Found: " + found_file)
          content = open(found_file).read()

          pattern = r'(\.method[^\n]*\bonCreate\b[^\n]*\n(?:[^\n]*\n)*?    \.locals\s+)(\d+)'
          match = re.search(pattern, content)

          if not match:
              raise SystemExit("ERROR: No onCreate with .locals")

          old_count = int(match.group(2))
          new_count = old_count + 1
          reg = "v" + str(old_count)
          print("Locals: " + str(old_count) + " -> " + str(new_count))

          new_content = content[:match.start(2)] + str(new_count) + content[match.end(2):]
          m2 = re.search(r'    \.locals\s+' + str(new_count) + r'\n', new_content)

          inject = (
              '    const-string ' + reg + ', "frida-gadget"\n'
              '    invoke-static {' + reg + '}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n'
          )
          new_content = new_content[:m2.end()] + inject + new_content[m2.end():]

          open(found_file, 'w').write(new_content)

          verify = open(found_file).read()
          if 'frida-gadget' in verify:
              print("VERIFIED: patch applied")
          else:
              raise SystemExit("ERROR: Verification failed")
          PY

      - name: Build APK
        run: |
          apktool b decoded --use-aapt2 -o unsigned.apk
          ls -la unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore ks.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key -storepass 123456 -keypass 123456 \
            -dname "CN=H, OU=H, O=H, L=H, ST=H, C=US"

          zipalign -v -p 4 unsigned.apk aligned.apk || cp unsigned.apk aligned.apk
          apksigner sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 \
            --out Hypper-Frida.apk aligned.apk
          ls -la Hypper-Frida.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypper-Frida
          path: Hypper-Frida.apk
          retention-days: 7
